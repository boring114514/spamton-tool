<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPAMTONIZER !!! [BIG SHOT]</title>
<style>
  :root {
    --bg: #1a1a24;
    --panel: #12121c;
    --input: #23233a;
    --pink: #ff4dff;
    --green: #7fff7f;
    --text: #eeeeee;
    --dim: #8888aa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    text-align: center;
    padding: 16px 10px 6px;
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    color: var(--pink);
    letter-spacing: 1px;
  }
  header p {
    margin: 4px 0 0;
    font-size: 11px;
    color: var(--dim);
  }
  main {
    flex: 1;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }
  label {
    font-size: 13px;
    color: var(--dim);
  }
  textarea {
    width: 100%;
    height: 110px;
    background: var(--panel);
    border: 1px solid #33334d;
    border-radius: 10px;
    color: var(--text);
    font-size: 16px;
    padding: 12px;
    resize: none;
    outline: none;
    font-family: inherit;
  }
  textarea:focus { border-color: var(--pink); }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  select, button {
    font-family: inherit;
    font-size: 15px;
    border-radius: 10px;
    border: none;
    padding: 10px 14px;
    background: var(--input);
    color: var(--text);
    cursor: pointer;
  }
  button.convert {
    flex: 1;
    background: linear-gradient(135deg, #ff4dff, #a44dff);
    color: #fff;
    font-weight: bold;
    letter-spacing: 1px;
  }
  button.copy { background: var(--input); }
  .opts { display: flex; gap: 16px; font-size: 14px; }
  .opts label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  output#out {
    flex: 1;
    min-height: 160px;
    background: var(--panel);
    border: 1px solid #2a2a44;
    border-radius: 10px;
    color: var(--green);
    font-size: 16px;
    line-height: 1.6;
    padding: 12px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  output#out:empty::before {
    content: "转换结果会出现在这里 ... [[LINK]]";
    color: #4a4a6a;
  }
  footer {
    text-align: center;
    font-size: 10px;
    color: #555577;
    padding: 8px;
  }
</style>
</head>
<body>
<header>
  <h1>SPAMTONIZER !!!</h1>
  <p>SPAMTON G. SPAMTON - THE merch MAN !! 中英双语自动识别</p>
</header>

<main>
  <label for="input">说点什么 / Type here -&gt; [[LINK]]</label>
  <textarea id="input">HEY EVERY!! 把你的话写在这里，朋友...</textarea>

  <div class="row">
    <select id="intensity">
      <option value="0.5">过轻 / mild</option>
      <option value="1.0" selected>适中 / mid</option>
      <option value="1.8">疯狂 / MAX</option>
    </select>
    <div class="opts">
      <label><input type="checkbox" id="filler" checked> 碎碎念</label>
      <label><input type="checkbox" id="price" checked> 价格</label>
    </div>
  </div>

  <div class="row">
    <button class="convert" id="convert">转换 !! CONVERT !!</button>
    <button class="copy" id="copy">复制 COPY</button>
  </div>

  <label>结果 / OUTPUT:</label>
  <output id="out"></output>
</main>

<footer>PRODUCED BY SPAMTON G. SPAMTON - THE merch MAN !!</footer>

<script>
"use strict";

// ---------------- Spamton logic (ported from Python) ----------------

const EN_BRACKET = [
  "BIG SHOT","HYPERLINK BLOCKED","LINK","DEAL","BROTHER","FRIEND",
  "FREEDOM","SPECIAL","OFFER","PROMOTION","[DEAL]","VIP",
  "SALE","SALESMAN","PATHS","WORLD","PAIN","[BIG SHOT]",
  "HELP","FUNNY","PIPE","[LINK]","DISCOUNT","the real deal"
];
const EN_INTERJ = [
  "HEY EVERY!!","IT'S ME!!","WOW!!!","WHY?!","WHAT THE!!","YOU!!!",
  "LISTEN!!","PLEASE!","CONGRATULATIONS!!!","WAIT!!!","OH NO!!","... eh?"
];
const EN_REGARDS = [
  "real","true","genuine","PEOPLE","friend","salesman",
  "champion","special friend","[the real deal]"
];
const EN_END = [
  "HELP!!!","PLEASE!!!","SHOW ME THE [LINK]!!!",
  "GIMME THAT [BIG SHOT]!!!","ITS MY [SPECIAL]!!",
  "YOU DON'T GET IT??? ... THAT'S RIGHT, YOU DO!!!",
  "HEE HEE! HOO HOO!! ... AHAHAHAHA!!!",
  "THE PRICE?? ... [EVERYTHING]!!",
  "SO [SPECIAL]!! WANNA MAKE A [DEAL]??",
  "WANNA BE FREE?? [BROTHER]!!"
];
const EN_PRICES = [
  "99.95","199.99","115.5","79.99","FREE","00.00","[FREE]","99.30","27","10","2002"
];

const CN_BRACKET = [
  "链接","优惠","自由","真正的交易","合作","兄弟","朋友",
  "超值","促销","特别","一折","好价","批发","赚翻了",
  "大酬宾","清仓","VIP","准链接","暴利"
];
const CN_INTERJ = [
  "HEY!!大家都!!","IT'S ME!!!","是我!!!","哇!!!!","为什么?!?!","你!!!",
  "听我说!!!","拜托!!!","恭喜!!!!","等等!!!","噢不!!","呵呵呵!!"
];
const CN_REGARDS = [
  "真的","真正的","可信的","朋友","兄弟","合伙人",
  "大客户","专属贵宾","天生的销售","老实人"
];
const CN_END = [
  "救救我!!!","拜托了!!!","快把那个[[链接]]给我!!!",
  "快给我[[优惠]]!!","这[[价格]]我可不能改!!",
  "嘿嘿嘿!!呵呵呵!!哈哈哈哈!!!","你想变得[[自由]]吗??兄弟!!!",
  "只要付出[[一切]]!!","这就是[[真正的交易]]!!","快把它抢走吧!!"
];
const CN_PRICES = [
  "99.95","199.99","115.5","79.99","免费","白送",
  "2002","0.99","一元","二十","八八","三折","统统免费"
];
const CN_PUNCT = [".", "...", "!", "!!", "?", "?", "~", "~"];
const EN_PUNCT = [".", "...", "!", "?", "~", ".", "...", "?", "!"];

function rand() { return Math.random(); }
function choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function isChinese(text) {
  const cjk = (text.match(/[\u4e00-\u9fff]/g) || []).length;
  const latin = (text.match(/[A-Za-z]/g) || []).length;
  return cjk >= 1 && cjk >= latin;
}

function capify(word) {
  const mode = rand();
  if (mode < 0.45) return word.toUpperCase();
  if (mode < 0.55) return word.charAt(0).toUpperCase() + word.slice(1);
  if (mode < 0.62 && word.length > 2) {
    return word.split("").map(c => (c.match(/[a-zA-Z]/) && rand() < 0.5) ? c.toUpperCase() : c).join("");
  }
  return word;
}

function sampleDistinct(arr, n) {
  const copy = arr.slice();
  const out = [];
  while (out.length < n && copy.length) {
    out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
  }
  return out;
}

function spamtonizeEN(text, intensity, filler, price) {
  const raw = text.replace(/\s+/g, " ").trim();
  if (!raw) return "";
  const sentences = raw.match(/[^.!?]+[.!?]*/g) || [raw];
  const parts = [];

  let usedB = new Set(), usedP = new Set();
  let i = 0;
  for (let sent of sentences) {
    const words = sent.match(/[\w'-]+|[^\w\s]/g) || [];
    const nw = [];
    for (let w of words) {
      if (!w.match(/[\w]/)) { nw.push(w); continue; }
      let cw = capify(w);
      if (price && rand() < 0.06 * intensity) {
        cw = choice(EN_PRICES.filter(x => !usedP.has(x)) || EN_PRICES);
        usedP.add(cw);
      }
      if (rand() < 0.05 * intensity) {
        cw = cw.toUpperCase() + " " + choice(EN_REGARDS).toUpperCase();
      }
      if (rand() < 0.1 * intensity) {
        const pick = choice(EN_BRACKET.filter(b => !usedB.has(b)) || EN_BRACKET);
        usedB.add(pick);
        nw.push(pick.includes("[") ? pick : "[[" + pick + "]]");
        i++;
      }
      nw.push(cw);
      i++;
      if (i % 6 === 0 && rand() < 0.18 * intensity) nw.push(choice(EN_PUNCT));
    }
    let joined = nw.join(" ").replace(/\s+([,.;:!?])/g, "$1");
    joined = joined.replace(/[. ]+$/, "");
    parts.push(joined + choice([".", "...", "!", "?", "?", "...", "!"]));
  }

  let final = parts.join(" ");
  if (filler) {
    const n = Math.floor(rand() * Math.max(0, 2 * intensity));
    for (let p of sampleDistinct(EN_INTERJ, Math.min(n, EN_INTERJ.length))) {
      final = p + " " + final;
    }
    if (rand() < 0.5 * intensity) final = final + " " + choice(EN_END);
  }
  final = final.replace(/\s+([,.;:!?])/g, "$1").replace(/ {2,}/g, " ").trim();
  return final;
}

function spamtonizeCN(text, intensity, filler, price) {
  const raw = text.replace(/\s+/g, "");
  if (!raw) return "";
  const parts = [];

  const words = raw.match(/[A-Za-z0-9']+|[.,!?。，！？；：、…<>]|./g) || [];
  const built = [];
  let usedB = new Set(), usedP = new Set();
  let idx = 0;
  for (let w of words) {
    if (!w || w.trim() === "") continue;
    if (/^[.,;!?。，！？；：、…]$/.test(w)) { built.push(w); continue; }
    let cur = w;
    if (price && rand() < 0.07 * intensity) {
      cur = choice(CN_PRICES.filter(x => !usedP.has(x)) || CN_PRICES);
      usedP.add(cur);
    }
    if (rand() < 0.06 * intensity) cur = cur + choice(["!", "?", "...", "."]);
    if (rand() < 0.03 * intensity && cur.length === 1 && /[\u4e00-\u9fff]/.test(cur)) {
      cur = cur + cur;
    }
    if (rand() < 0.06 * intensity) {
      const pick = choice(CN_BRACKET.filter(b => !usedB.has(b)) || CN_BRACKET);
      usedB.add(pick);
      built.push("[[" + pick + "]]");
    }
    built.push(cur);
    idx++;
    if (idx % 6 === 0 && rand() < 0.14 * intensity) built.push(choice(CN_PUNCT));
  }

  let final = parts.join("") + built.join("");
  if (filler) {
    const n = Math.floor(rand() * Math.max(0, 2 * intensity));
    for (let p of sampleDistinct(CN_INTERJ, Math.min(n, CN_INTERJ.length))) {
      final = p + " " + final;
    }
    if (rand() < 0.55 * intensity) final = final + " " + choice(CN_END);
  }
  final = final.replace(/\s+/g, " ").trim();
  return final;
}

function spamtonize(text, intensity, filler, price) {
  const raw = text.replace(/\s+/g, " ").trim();
  if (!raw) return "";
  if (isChinese(raw)) return spamtonizeCN(raw, intensity, filler, price);
  return spamtonizeEN(raw, intensity, filler, price);
}

// ---------------- UI ----------------

const input = document.getElementById("input");
const out = document.getElementById("out");
const btnConvert = document.getElementById("convert");
const btnCopy = document.getElementById("copy");
const selIntensity = document.getElementById("intensity");
const chkFiller = document.getElementById("filler");
const chkPrice = document.getElementById("price");

function convert() {
  const text = input.value;
  const result = spamtonize(
    text,
    parseFloat(selIntensity.value),
    chkFiller.checked,
    chkPrice.checked
  );
  out.textContent = result;
  return result;
}

btnConvert.addEventListener("click", convert);
btnCopy.addEventListener("click", () => {
  const result = out.textContent;
  if (!result) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(result).catch(() => fallbackCopy(result));
  } else {
    fallbackCopy(result);
  }
  btnCopy.textContent = "已复制 !! COPIED !!";
  setTimeout(() => { btnCopy.textContent = "复制 COPY"; }, 1200);
});
input.addEventListener("keydown", e => {
  if (e.ctrlKey && e.key === "Enter") convert();
});
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
}
</script>
</body>
</html>
